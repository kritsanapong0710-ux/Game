<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ARCHIVE OS v5.0 - RECONSTRUCTED</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #1a73e8; --bg: #000; --messenger: #0084ff; --danger: #ff4b2b; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Kanit', sans-serif; background: #000; overflow: hidden; }

        /* Subtle Scanline Effect */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 1000; background-size: 100% 4px; pointer-events: none; opacity: 0.3;
        }

        #os-container { width: 100vw; height: 100vh; display: flex; padding: 15px; gap: 15px; background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070') center/cover; }

        .window { background: rgba(255,255,255,0.95); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .window-header { background: #e0e0e0; padding: 8px 15px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #ccc; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
        
        #browser { flex: 6; }
        #address-bar { background: #fff; padding: 4px 15px; border-radius: 15px; font-size: 12px; flex: 1; margin: 0 10px; border: 1px solid #ddd; color: #666; font-family: 'JetBrains Mono'; }

        #messenger { flex: 4; display: flex; flex-direction: column; }
        #chat-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fdfdfd; scroll-behavior: smooth; }

        .bubble { max-width: 85%; padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.4; opacity: 0; transform: translateY(10px); transition: 0.4s ease; }
        .bubble.show { opacity: 1; transform: translateY(0); }
        .received { align-self: flex-start; background: #e4e6eb; color: #050505; border-bottom-left-radius: 4px; }
        .sent { align-self: flex-end; background: var(--messenger); color: #fff; border-bottom-right-radius: 4px; }

        .vid-card { width: 100%; max-width: 280px; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #eee; }
        .vid-card video { width: 100%; aspect-ratio: 16/9; object-fit: cover; opacity: 0.5; }
        .play-btn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; background: rgba(0,0,0,0.3); font-size: 30px; }

        #google-search-container { padding: 50px 20px; text-align: center; }
        #search-box { width: 100%; max-width: 450px; padding: 12px 20px; border-radius: 25px; border: 1px solid #dfe1e5; font-size: 16px; outline: none; }

        #game-over { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        #game-over h1 { font-size: 60px; color: var(--danger); text-shadow: 0 0 20px rgba(255,0,0,0.8); }

        #action-btn { width: 100%; padding: 15px; background: #fff; border: none; border-top: 1px solid #eee; cursor: pointer; font-family: 'Kanit'; font-weight: 500; font-size: 15px; }

        #video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; justify-content: center; align-items: center; }
        #fs-video { width: 90%; max-height: 85%; }
        .close-vid { position: absolute; top: 20px; right: 20px; background: #fff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }

        .glitch-active { animation: shake 0.1s infinite; filter: hue-rotate(90deg) contrast(2); }
        @keyframes shake { 0%{transform:translate(0)} 25%{transform:translate(-5px,5px)} 50%{transform:translate(5px,-5px)} 100%{transform:translate(0)} }
    </style>
</head>
<body onclick="startAudio()">

<audio id="snd-bg" loop src="https://assets.mixkit.co/music/preview/mixkit-horror-background-ambience-533.mp3"></audio>
<audio id="snd-msg" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7306236683.mp3"></audio>
<audio id="snd-type" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c369e7943a.mp3"></audio>

<div id="os-container">
    <div class="window" id="browser">
        <div class="window-header">
            <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
            <div id="address-bar">https://www.google.com</div>
        </div>
        <div id="google-search-container">
            <h1 style="font-size: 70px; margin-bottom: 20px;"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></h1>
            <input type="text" id="search-box" placeholder="ค้นหาข้อมูลลับของชมรม..." oninput="playTyping()" onkeydown="if(event.key==='Enter') searchGoogle()">
            <div id="results-area" style="max-width: 500px; margin: 0 auto;"></div>
        </div>
    </div>

    <div class="window" id="messenger">
        <div class="window-header">
            <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
            <div style="font-size: 12px; margin-left: 10px; color: #666; font-weight: 500;">Messenger</div>
        </div>
        <div style="padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px;">
            <div style="width: 35px; height: 35px; background: #333; border-radius: 50%;"></div>
            <div id="chat-title" style="font-weight: 500; font-size: 14px;">ลมเหนือ</div>
        </div>
        <div id="chat-content"></div>
        <div id="choice-area" style="display: none; padding: 10px; flex-direction: column; gap: 8px;"></div>
        <button id="action-btn" onclick="nextStep()">เริ่มการสนทนา</button>
    </div>
</div>

<div id="video-overlay">
    <video id="fs-video" controls></video>
    <button class="close-vid" onclick="closeFS()">ปิดวิดีโอ</button>
</div>

<div id="game-over">
    <h2 style="font-weight: 300;">STATUS: <span id="status-text">MISSING</span></h2>
    <h1>YOU DIED</h1>
    <p id="death-reason" style="margin-top: 15px; color: #ccc;"></p>
    <button class="restart-btn" onclick="location.reload()">RESTART SYSTEM</button>
</div>

<script>
    let audioStarted = false;
    function startAudio() {
        if (!audioStarted) {
            document.getElementById('snd-bg').volume = 0.4;
            document.getElementById('snd-bg').play();
            audioStarted = true;
        }
    }

    function playTyping() {
        const s = document.getElementById('snd-type');
        s.currentTime = 0;
        s.play();
    }

    const story = [
        { type: "sys", text: "SYSTEM_ONLINE: คืนค่าการสนทนาล่าสุด" },
        { type: "received", text: "มาร์ค! กู้ไฟล์ Harddrive เก่าของชมรมได้แล้วว่ะ!" },
        { type: "received", text: "จำได้มั้ย? ตอนที่เราแอบเข้าชมรมปี 2016 ลองดูคลิปนี้ดิ", vid: "https://assets.mixkit.co/videos/preview/mixkit-friends-walking-together-in-the-forest-4416-large.mp4" },
        { type: "sent", text: "เออ จำได้ 555 อย่างรั่วเลย" },
        { type: "received", text: "มาร์ค... ลองดูวินาทีที่ 0:08 ในคลิปสิ ข้างหลังประตูมีคนแอบมองเราอยู่" },
        { type: "received", text: "ช่วยหาชื่อ 'ชมรมลับ2016' ใน Google ให้หน่อยดิ ฉันว่ามันแปลกๆ" },
        { type: "choice", choices: [
            { text: "ค้นหาข้อมูลใน Google", action: "search" },
            { text: "ถามเหนือ: นายเจออย่างอื่นในไฟล์มั้ย?", target: 8 }
        ]},
        { type: "received", text: "ในนั้นมีชื่อ 'กิตติ' รหัสมรณะ MC-404 มาร์ค... ดูคลิปนี้ที่เขาทิ้งไว้", vid: "https://assets.mixkit.co/videos/preview/mixkit-security-camera-in-a-dark-hallway-32688-large.mp4" },
        { type: "sys", text: "WARNING: ตรวจพบสัญญาณแทรกแซงจาก ADMIN-04", glitch: true },
        { type: "received", text: "อย่าเชื่อคนในแชท! ฉันคือเหนือตัวจริง ฉันแอบอยู่ในรถตู้!", partner: "ADMIN-04", vid: "https://assets.mixkit.co/videos/preview/mixkit-mysterious-man-in-a-hoodie-standing-in-the-dark-32677-large.mp4" },
        { type: "choice", choices: [
            { text: "รีบวิ่งหนีออกจากห้อง (EXIT)", target: 12 },
            { text: "หันไปมองข้างหลัง (STAY)", target: 11 }
        ]},
        { type: "received", text: "นายช้าไป... มาร์ค", glitch: true },
        { type: "end", status: "MISSING", reason: "ไม่มีใครพบร่องรอยของคุณในห้องชมรมอีกเลย" },
        { type: "end", status: "REPLACED", reason: "คุณรอดมาได้... แต่มันยังตามคุณกลับมาที่บ้าน" }
    ];

    let current = -1;
    let isTyping = false;

    function nextStep() {
        if (isTyping) return;
        current++;
        if (current >= story.length) return;
        
        const d = story[current];
        document.getElementById('action-btn').innerText = "ถัดไป";

        if (d.type === "end") {
            showGameOver(d.status, d.reason);
            return;
        }

        if (d.type === "choice") {
            showChoices(d.choices);
            return;
        }

        if (d.partner) {
            document.getElementById('chat-title').innerText = d.partner;
            document.getElementById('chat-title').style.color = "red";
        }

        if (d.glitch) {
            document.getElementById('os-container').classList.add('glitch-active');
            setTimeout(() => document.getElementById('os-container').classList.remove('glitch-active'), 1000);
        }

        addBubbleWithDelay(d);
    }

    function addBubbleWithDelay(d) {
        isTyping = true;
        const chat = document.getElementById('chat-content');
        
        // หน่วงเวลาให้เหมือนคนพิมพ์
        setTimeout(() => {
            if (d.type === "sys") {
                const s = document.createElement('div');
                s.style = "text-align:center; font-size:11px; color:#888; font-family:monospace; margin-bottom:10px;";
                s.innerText = `[${d.text}]`;
                chat.appendChild(s);
            } else {
                document.getElementById('snd-msg').play();
                const b = document.createElement('div');
                b.className = `bubble ${d.type}`;
                b.innerText = d.text;
                chat.appendChild(b);
                setTimeout(() => b.classList.add('show'), 50);

                if (d.vid) {
                    const v = document.createElement('div');
                    v.className = "vid-card";
                    v.innerHTML = `
                        <video src="${d.vid}"></video>
                        <div class="play-btn" onclick="openFS('${d.vid}')">▶</div>
                    `;
                    chat.appendChild(v);
                }
            }
            chat.scrollTop = chat.scrollHeight;
            isTyping = false;
        }, 800);
    }

    function openFS(src) {
        const ov = document.getElementById('video-overlay');
        const v = document.getElementById('fs-video');
        v.src = src;
        ov.style.display = 'flex';
        v.play();
    }

    function closeFS() {
        document.getElementById('video-overlay').style.display = 'none';
        document.getElementById('fs-video').pause();
    }

    function searchGoogle() {
        const q = document.getElementById('search-box').value;
        const res = document.getElementById('results-area');
        if (q.includes("ชมรมลับ2016")) {
            res.innerHTML = `
                <div style="background:#fff; padding:15px; border:1px solid #ddd; border-radius:8px; text-align:left; margin-top:20px;">
                    <h3 style="color:#1a0dab; margin:0;">[FILE] บันทึกเหตุการณ์ MC-404</h3>
                    <p style="font-size:13px; color:#444;">พบศพนักศึกษาชื่อ 'กิตติ' เมื่อปี 2559...</p>
                    <button onclick="nextStep()" style="background:var(--blue); color:white; border:none; padding:5px 10px; cursor:pointer;">อ่านไฟล์</button>
                </div>`;
        }
    }

    function showChoices(choices) {
        const area = document.getElementById('choice-area');
        const btn = document.getElementById('action-btn');
        area.innerHTML = "";
        area.style.display = "flex";
        btn.style.display = "none";

        choices.forEach(c => {
            const b = document.createElement('button');
            b.style = "padding:12px; border:1px solid var(--messenger); border-radius:10px; background:#fff; color:var(--messenger); cursor:pointer; font-family:'Kanit';";
            b.innerText = c.text;
            b.onclick = () => {
                area.style.display = "none";
                btn.style.display = "block";
                if (c.action === "search") {
                    document.getElementById('search-box').focus();
                } else {
                    current = c.target - 1;
                    nextStep();
                }
            };
            area.appendChild(b);
        });
    }

    function showGameOver(status, reason) {
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('status-text').innerText = status;
        document.getElementById('death-reason').innerText = reason;
        document.getElementById('snd-bg').pause();
    }

    nextStep();
</script>
</body>
</html>
